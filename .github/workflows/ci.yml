name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
# Actions are pinned to full commit SHAs (looked up with git ls-remote); the comment names the tag.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: py
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.32"
      - run: uv sync --locked --python "${{ steps.py.outputs.python-path }}"
      - run: uv run --python "${{ steps.py.outputs.python-path }}" ruff check .
      - run: uv run --python "${{ steps.py.outputs.python-path }}" pytest -rs
      - run: uv run --python "${{ steps.py.outputs.python-path }}" python tools/gen_rules.py --check

  # The hook supports Python 3.9 (macOS ships 3.9 as /usr/bin/python3), so the whole suite,
  # including every hook test, also runs on 3.9. The rule generator test skips there (needs 3.11).
  python-3-9:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # actions/setup-python has no 3.9 for the current Ubuntu image, so uv installs a
      # standalone CPython 3.9 build instead.
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.32"
      - run: uv python install 3.9
      - run: uv sync --locked --python 3.9
      - run: uv run --python 3.9 python --version
      - run: uv run --python 3.9 pytest -rs

  # A23 to A25: the review's glob oracle (tests/oracle). Real bash, zsh and sh expand every generated
  # word; a word that reaches a protected path must be denied, and everyday commands allowed.
  # A missing shell or mode is a failure (--require auto, which on macOS includes the system
  # /bin/bash 3.2, where .* and .? match . and ..). The hook runs on Python 3.9 (macOS
  # ships it as /usr/bin/python3, the hook's default there) and on the newest Python.
  # Windows has none of these shells and does not run it; the Windows guard stays experimental.
  oracle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        hook-python: ["3.9", "3.x"]
    runs-on: ${{ matrix.os }}
    env:
      DENYPEEK_ORACLE_REQUIRE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.32"
      - name: Install zsh (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Install bash 5 (macOS; /bin/bash is 3.2)
        if: runner.os == 'macOS'
        run: brew install bash
      - run: uv python install ${{ matrix.hook-python }}
      - id: py
        run: echo "path=$(uv python find ${{ matrix.hook-python }})" >> "$GITHUB_OUTPUT"
      - name: Full oracle run
        run: >-
          "${{ steps.py.outputs.path }}" tests/oracle/glob_oracle.py --require auto
          --hook "$PWD/src/denypeek/guard/guard.py" --python "${{ steps.py.outputs.path }}"
          --report oracle-failures.txt | tee oracle-output.txt
      # Fail if the run checked nothing: every tier must have run cases, none skipped.
      - name: The oracle ran words
        run: >-
          "${{ steps.py.outputs.path }}" -c "import re,sys;
          t=open('oracle-output.txt').read();
          r=[l for l in t.splitlines() if l.startswith('RESULT')];
          assert r, 'no RESULT line';
          n={k:int(v) for k,v in re.findall(r'(NAMED|GENERATED|SENTINEL|MUST-ALLOW) \\d+/(\\d+)', r[-1])};
          print(r[-1], n);
          assert len(n)==4 and all(v>0 for v in n.values()), 'a tier ran no cases';
          assert ' 0 failed' in r[-1] and 'skipped cases: 0' in r[-1] and 'skipped modes: none' in r[-1]"
      - name: Oracle self-test
        run: '"${{ steps.py.outputs.path }}" tests/oracle/glob_oracle.py --self-test --quick'
