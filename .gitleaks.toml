# gitleaks config for scanning this repo. Uses the default rules plus two exact allowlist entries.
[extend]
useDefault = true

[allowlist]
description = """Exact matches only. (1) src/denypeek/rules.py holds the bedrock rule's own regex, \
whose fixed prefix is base64 of the public hostname bedrock.amazonaws.com. (2) \
tests/oracle/words.tsv labels a generated word class 'combo:collating+dquote' next to a path \
holding 'credentials'. Neither is a key."""
regexes = [
    '''^bedrock-api-key-YmVkcm9jay5hbWF6b25hd3MuY29t$''',
    '''^collating\+dquote$''',
]
