[project]
name = "denypeek"
version = "0.1.0"
description = "Keep API keys out of your coding agents: block secret-file reads, find and scrub keys in agent history."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Sparli Aman", email = "hello@sparli.dev" }]
dependencies = []
keywords = ["secrets", "claude-code", "codex", "cursor", "gemini-cli", "security", "hooks"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/Sparli/denypeek"
Repository = "https://github.com/Sparli/denypeek"
Issues = "https://github.com/Sparli/denypeek/issues"
Changelog = "https://github.com/Sparli/denypeek/blob/main/CHANGELOG.md"

[project.scripts]
denypeek = "denypeek.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/denypeek"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["src/denypeek/rules.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP007", "UP045"]
