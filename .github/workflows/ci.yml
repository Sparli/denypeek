name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
# Actions are pinned to full commit SHAs (looked up with git ls-remote); the comment names the tag.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: py
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.32"
      - run: uv sync --locked --python "${{ steps.py.outputs.python-path }}"
      - run: uv run --python "${{ steps.py.outputs.python-path }}" ruff check .
      - run: uv run --python "${{ steps.py.outputs.python-path }}" pytest
      - run: uv run --python "${{ steps.py.outputs.python-path }}" python tools/gen_rules.py --check

